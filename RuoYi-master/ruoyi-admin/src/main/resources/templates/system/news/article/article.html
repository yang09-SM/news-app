<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('新闻列表')" />
</head>
<body class="gray-bg">
    <div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="news-form">
					<div class="select-list">
						<ul>
							<li>
								新闻标题：<input type="text" name="title"/>
							</li>
							<li>
								发布人员：<input type="text" name="createBy"/>
							</li>
							<li>
								新闻分类：<select name="categoryId" th:with="categories=${@newsCategoryService.selectCategoryList(new T(com.ruoyi.system.domain.NewsCategory))}">
									<option value="">所有</option>
									<option th:each="category : ${categories}" th:text="${category.categoryName}" th:value="${category.categoryId}"></option>
								</select>
							</li>
							<li>
								新闻状态：<select name="status">
									<option value="">所有</option>
									<option value="0">草稿</option>
									<option value="1">已发布</option>
									<option value="2">已下线</option>
								</select>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>
			
	        <div class="btn-group-sm" id="toolbar" role="group">
		        <a class="btn btn-success" onclick="$.operate.addFull()" shiro:hasPermission="system:news:add">
		            <i class="fa fa-plus"></i> 新增
		        </a>
		        <a class="btn btn-primary single disabled" onclick="$.operate.editFull()" shiro:hasPermission="system:news:edit">
		            <i class="fa fa-edit"></i> 修改
		        </a>
		        <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:news:remove">
		            <i class="fa fa-remove"></i> 删除
		        </a>
	        </div>
	        
	        <div class="col-sm-12 select-table table-striped">
	            <table id="bootstrap-table"></table>
	        </div>
    	</div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('news:article:edit')}]];
        var removeFlag = [[${@permission.hasPermi('news:article:remove')}]];
        var categories = [[${@newsCategoryService.selectCategoryList(new T(com.ruoyi.system.domain.NewsCategory))}]];
        var prefix = ctx + "system/news/article";

        $(function() {
            var options = {
                url: prefix + "/list",
                viewUrl: prefix + "/view/{id}",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                modalName: "新闻",
                columns: [{
		            checkbox: true
		        },
				{
					field : 'articleId', 
					title : '序号' 
				},
				{
		            field: 'title',
		            title: '新闻标题',
		            formatter: function (value, row, index) {
		                return '<a href="javascript:void(0)" onclick="$.operate.view(\'' + row.articleId + '\')">' + value + '</a>';
		            }
		        },
				{
		            field: 'categoryId',
		            title: '新闻分类',
		            align: 'center',
		            formatter: function(value, row, index) {
		            	var category = categories.find(function(c) { return c.categoryId == value; });
		            	return category ? category.categoryName : '-';
		            }
		        },
				{
		            field: 'status',
		            title: '状态',
		            align: 'center',
		            formatter: function(value, row, index) {
		            	if (value == '0') return '<span class="label label-default">草稿</span>';
		            	if (value == '1') return '<span class="label label-primary">已发布</span>';
		            	if (value == '2') return '<span class="label label-danger">已下线</span>';
		            	return value;
		            }
		        },
				{
					field : 'viewCount', 
					title : '阅读量' 
				},
				{
					field : 'createBy', 
					title : '创建者' 
				},
				{
		            field: 'createTime',
		            title: '创建时间',
		            sortable: true
		        },
		        {
		            title: '操作',
		            align: 'center',
		            formatter: function(value, row, index) {
		            	var actions = [];
		            	actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="$.operate.view(\'' + row.articleId + '\')"><i class="fa fa-eye"></i>详情</a> ');
		            	actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.editFull(\'' + row.articleId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.articleId + '\')"><i class="fa fa-remove"></i>删除</a>');
						return actions.join('');
		            }
		        }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
