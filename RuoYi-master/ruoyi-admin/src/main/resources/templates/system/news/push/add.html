<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('新增推送任务')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-push-add">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">推送标题：</label>
                <div class="col-sm-8">
                    <input id="title" name="title" class="form-control" type="text" required placeholder="请输入推送标题">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">推送内容：</label>
                <div class="col-sm-8">
                    <textarea id="content" name="content" class="form-control" rows="4" required placeholder="请输入推送内容"></textarea>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">推送类型：</label>
                <div class="col-sm-8">
                    <div class="radio-box">
                        <label><input type="radio" name="pushType" value="all" checked/> 全量推送（推送给所有用户）</label><br/>
                        <label><input type="radio" name="pushType" value="tag"/> 按标签推送（按分类ID推送）</label><br/>
                        <label><input type="radio" name="pushType" value="alias"/> 按别名推送（按用户ID推送）</label><br/>
                        <label><input type="radio" name="pushType" value="single"/> 单设备推送（按设备注册ID推送）</label>
                    </div>
                </div>
            </div>
            <div class="form-group" id="targetValueGroup" style="display:none;">
                <label class="col-sm-3 control-label">目标值：</label>
                <div class="col-sm-8">
                    <input id="targetValue" name="targetValue" class="form-control" type="text" placeholder="请输入目标值（标签/别名/设备ID）">
                    <span class="help-block m-b-none" id="targetValueHelp"></span>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">备注：</label>
                <div class="col-sm-8">
                    <input id="remark" name="remark" class="form-control" type="text" placeholder="请输入备注信息">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script type="text/javascript">
        var prefix = ctx + "system/news/push";

        $("#form-push-add").validate({
            focusCleanup: true
        });

        // 监听推送类型变化，控制目标值显示
        $("input[name='pushType']").change(function() {
            var pushType = $(this).val();
            if (pushType === 'all') {
                $("#targetValueGroup").hide();
                $("#targetValue").removeAttr("required");
            } else {
                $("#targetValueGroup").show();
                $("#targetValue").attr("required", "required");
                if (pushType === 'tag') {
                    $("#targetValueHelp").text("请输入分类ID");
                } else if (pushType === 'alias') {
                    $("#targetValueHelp").text("请输入用户ID");
                } else if (pushType === 'single') {
                    $("#targetValueHelp").text("请输入设备注册ID（registrationId）");
                }
            }
        });

        function submitHandler() {
            if ($.validate.form()) {
                var pushType = $("input[name='pushType']:checked").val();
                if (pushType !== 'all' && !$("#targetValue").val()) {
                    $.modal.msgError("请输入目标值");
                    return false;
                }
                $.operate.save(prefix + "/add", $('#form-push-add').serialize());
            }
        }
    </script>
</body>
</html>
