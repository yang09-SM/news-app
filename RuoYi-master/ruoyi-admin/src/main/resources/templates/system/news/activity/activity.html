<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('活动列表')" />
</head>
<body class="gray-bg">
    <div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="activity-form">
					<div class="select-list">
						<ul>
							<li>
								活动名称：<input type="text" name="activityName"/>
							</li>
							<li>
								活动类型：<select name="activityType">
									<option value="">所有</option>
									<option value="0">签到</option>
									<option value="1">阅读</option>
									<option value="2">分享</option>
									<option value="3">评论</option>
									<option value="4">邀请</option>
								</select>
							</li>
							<li>
								状态：<select name="status" th:with="type=${@dict.getType('sys_normal_disable')}">
									<option value="">所有</option>
									<option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
								</select>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

	        <div class="btn-group-sm" id="toolbar" role="group">
		        <a class="btn btn-success" onclick="$.operate.addFull()" shiro:hasPermission="news:activity:add">
		            <i class="fa fa-plus"></i> 新增
		        </a>
		        <a class="btn btn-primary single disabled" onclick="$.operate.editFull()" shiro:hasPermission="news:activity:edit">
		            <i class="fa fa-edit"></i> 修改
		        </a>
		        <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="news:activity:remove">
		            <i class="fa fa-remove"></i> 删除
		        </a>
	        </div>

	        <div class="col-sm-12 select-table table-striped">
	            <table id="bootstrap-table"></table>
	        </div>
    	</div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('news:activity:edit')}]];
        var removeFlag = [[${@permission.hasPermi('news:activity:remove')}]];
        var datas = [[${@dict.getType('sys_normal_disable')}]];
        var activityTypeDatas = [[${@dict.getType('news_activity_type')}]];
        var prefix = ctx + "system/news/activity";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                modalName: "活动",
                columns: [{
		            checkbox: true
		        },
				{
					field : 'activityId',
					title : '活动ID'
				},
				{
		            field: 'activityName',
		            title: '活动名称'
		        },
				{
		            field: 'activityCode',
		            title: '活动编码'
		        },
				{
					field : 'activityType',
					title : '活动类型',
					align: 'center',
					formatter: function(value, row, index) {
						return $.table.selectDictLabel(activityTypeDatas, value);
					}
				},
				{
					field : 'pointReward',
					title : '积分奖励'
				},
				{
					field : 'cashReward',
					title : '现金奖励'
				},
				{
					field : 'participantCount',
					title : '参与人数'
				},
				{
		            field: 'status',
		            title: '状态',
		            align: 'center',
		            formatter: function(value, row, index) {
		            	return $.table.selectDictLabel(datas, value);
		            }
		        },
				{
		            field: 'startTime',
		            title: '开始时间',
		            sortable: true
		        },
				{
		            field: 'endTime',
		            title: '结束时间',
		            sortable: true
		        },
		        {
		            title: '操作',
		            align: 'center',
		            formatter: function(value, row, index) {
		            	var actions = [];
		            	actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.editFull(\'' + row.activityId + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.activityId + '\')"><i class="fa fa-remove"></i>删除</a>');
						return actions.join('');
		            }
		        }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
