<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('用户列表')" />
</head>
<body class="gray-bg">
    <div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="user-form">
					<div class="select-list">
						<ul>
							<li>
								昵称：<input type="text" name="nickName"/>
							</li>
							<li>
								用户ID：<input type="text" name="userId"/>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

	        <div class="col-sm-12 select-table table-striped">
	            <table id="bootstrap-table"></table>
	        </div>
    	</div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var detailFlag = [[${@permission.hasPermi('news:user:detail')}]];
        var prefix = ctx + "system/news/user";

        $(function() {
            var options = {
                url: prefix + "/list",
                modalName: "用户",
                columns: [{
		            checkbox: true
		        },
				{
					field : 'id',
					title : '扩展ID'
				},
				{
					field : 'userId',
					title : '用户ID'
				},
				{
		            field: 'nickName',
		            title: '昵称'
		        },
				{
					field : 'points',
					title : '积分'
				},
				{
					field : 'cashBalance',
					title : '现金余额'
				},
				{
					field : 'level',
					title : '等级'
				},
				{
					field : 'vipLevel',
					title : 'VIP等级'
				},
				{
					field : 'followCount',
					title : '关注数'
				},
				{
					field : 'fansCount',
					title : '粉丝数'
				},
				{
		            field: 'createTime',
		            title: '创建时间',
		            sortable: true
		        },
		        {
		            title: '操作',
		            align: 'center',
		            formatter: function(value, row, index) {
		            	var actions = [];
		            	actions.push('<a class="btn btn-info btn-xs ' + detailFlag + '" href="javascript:void(0)" onclick="$.operate.detail(\'' + row.id + '\')"><i class="fa fa-search"></i>详情</a>');
						return actions.join('');
		            }
		        }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
