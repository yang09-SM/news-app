<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('处理举报')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-report-edit" th:object="${report}">
            <input id="reportId" name="reportId" th:field="*{reportId}"  type="hidden">
			<div class="form-group">
				<label class="col-sm-2 control-label">举报ID：</label>
				<div class="col-sm-10">
					<input id="reportIdShow" th:value="*{reportId}" class="form-control" type="text" readonly>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">举报人ID：</label>
				<div class="col-sm-10">
					<input id="reporterId" name="reporterId" th:field="*{reporterId}" class="form-control" type="text" readonly>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">举报类型：</label>
				<div class="col-sm-10">
					<input id="reportTypeShow" th:value="*{reportType}" class="form-control" type="text" readonly>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">被举报对象ID：</label>
				<div class="col-sm-10">
					<input id="targetId" name="targetId" th:field="*{targetId}" class="form-control" type="text" readonly>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">举报原因：</label>
				<div class="col-sm-10">
					<input id="reason" name="reason" th:field="*{reason}" class="form-control" type="text" readonly>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">详细描述：</label>
				<div class="col-sm-10">
					<textarea id="description" name="description" th:field="*{description}" class="form-control" readonly></textarea>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label is-required">状态：</label>
				<div class="col-sm-10">
					<select id="status" name="status" class="form-control m-b" required>
						<option value="1" th:field="*{status}">处理中</option>
						<option value="2" th:field="*{status}">已处理</option>
						<option value="3" th:field="*{status}">已驳回</option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label is-required">处理结果：</label>
				<div class="col-sm-10">
					<textarea id="handleResult" name="handleResult" th:field="*{handleResult}" class="form-control" required></textarea>
				</div>
			</div>
		</form>
	</div>
    <th:block th:include="include :: footer" />
    <script type="text/javascript">
        var prefix = ctx + "system/news/report";

		$("#form-report-edit").validate({
			focusCleanup: true
		});

		function submitHandler() {
	        if ($.validate.form()) {
				$.operate.save(prefix + "/edit", $('#form-report-edit').serialize());
	        }
	    }
	</script>
</body>
</html>
