<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('离线新闻列表')" />
</head>
<body class="gray-bg">
    <div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="offline-form">
					<div class="select-list">
						<ul>
							<li>
								用户ID：<input type="text" name="userId"/>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
							</li>
						</ul>
					</div>
				</form>
			</div>

	        <div class="btn-group-sm" id="toolbar" role="group">
		        <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="news:offline:remove">
		            <i class="fa fa-remove"></i> 删除
		        </a>
	        </div>

	        <div class="col-sm-12 select-table table-striped">
	            <table id="bootstrap-table"></table>
	        </div>
    	</div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var removeFlag = [[${@permission.hasPermi('news:offline:remove')}]];
        var prefix = ctx + "system/news/offline";

        $(function() {
            var options = {
                url: prefix + "/list",
                removeUrl: prefix + "/remove",
                modalName: "离线新闻",
                columns: [{
		            checkbox: true
		        },
				{
					field : 'offlineId',
					title : '记录ID'
				},
				{
					field : 'userId',
					title : '用户ID'
				},
				{
		            field: 'articleTitle',
		            title: '文章标题'
		        },
				{
					field : 'fileSize',
					title : '文件大小'
				},
				{
		            field: 'downloadTime',
		            title: '下载时间',
		            sortable: true
		        },
				{
		            field: 'createTime',
		            title: '创建时间',
		            sortable: true
		        }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
