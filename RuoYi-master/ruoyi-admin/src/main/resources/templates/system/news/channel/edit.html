<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('修改频道')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-channel-edit" th:object="${channel}">
            <input id="channelId" name="channelId" th:field="*{channelId}"  type="hidden">
			<div class="form-group">
				<label class="col-sm-2 control-label is-required">频道名称：</label>
				<div class="col-sm-10">
					<input id="channelName" name="channelName" th:field="*{channelName}" class="form-control" type="text" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label is-required">频道编码：</label>
				<div class="col-sm-10">
					<input id="channelCode" name="channelCode" th:field="*{channelCode}" class="form-control" type="text" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">频道图标：</label>
				<div class="col-sm-10">
					<input id="channelIcon" name="channelIcon" th:field="*{channelIcon}" class="form-control" type="text">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">频道描述：</label>
				<div class="col-sm-10">
					<textarea id="channelDesc" name="channelDesc" th:field="*{channelDesc}" class="form-control"></textarea>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">新闻数量：</label>
				<div class="col-sm-10">
					<input id="newsCount" name="newsCount" th:field="*{newsCount}" class="form-control" type="number">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">排序：</label>
				<div class="col-sm-10">
					<input id="orderNum" name="orderNum" th:field="*{orderNum}" class="form-control" type="number">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-2 control-label">状态：</label>
				<div class="col-sm-10">
				    <div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
						<input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:field="*{status}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>
		</form>
	</div>
    <th:block th:include="include :: footer" />
    <script type="text/javascript">
        var prefix = ctx + "system/news/channel";

		$("#form-channel-edit").validate({
			focusCleanup: true
		});

		function submitHandler() {
	        if ($.validate.form()) {
				$.operate.save(prefix + "/edit", $('#form-channel-edit').serialize());
	        }
	    }
	</script>
</body>
</html>
