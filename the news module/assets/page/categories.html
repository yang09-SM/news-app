        openPage: function(url) {

          // 当前窗口打开url页面

        },
        //关闭id为targetId的目标容器
        hide: function(targetId) {
            const modal = document.getElementById(targetId);//获取targetId的元素
            // 检查targetId元素是否存在
            if (!modal) {console.error('Modal element not found: targetId');return;}
            //1. 准备隐藏前先清理旧动画和监听器
            if (modal._hideTimeout) clearTimeout(modal._hideTimeout);
            if (modal._showAnimationEndHandler) {
                modal.removeEventListener("animationend", modal._showAnimationEndHandler);
                delete modal._showAnimationEndHandler;
            }
            modal.style.animation = "";
            // 2. 强制重绘以确保样式应用
            void modal.offsetHeight;
            // 3. 启动淡出动画
            modal.style.animation = 'yt_modalFadeOut 0.3s ease-out';
            let animationCompleted = false;
            const onAnimationEnd = function () {
              if (animationCompleted) return;
              animationCompleted = true;
              // 4. 动画结束后，添加隐藏类并清空所有内联干扰样式
              modal.classList.add("hidden");
              modal.style.display = "";
              modal.style.visibility = "";
              modal.style.opacity = "";
              modal.style.animation = "";
              modal.style.transform = "";
              // 清理引用
              delete modal._hideAnimationEndHandler;
              if (modal._hideTimeout) {
                clearTimeout(modal._hideTimeout);
                delete modal._hideTimeout;
              }
            };
            // 5. 使用事件监听 + 定时器双重保险，确保清理逻辑一定会执行
            modal._hideAnimationEndHandler = onAnimationEnd;
            modal.addEventListener("animationend", onAnimationEnd, { once: true });
            modal._hideTimeout = setTimeout(onAnimationEnd, 400); // 略长于动画时间
        },
        //显示id为targetId的目标容器
        show: function(targetId, callback) {
            const modal = document.getElementById(targetId);//获取targetId的隐藏框元素
            // 检查targetId的隐藏框元素是否存在
            if (!modal) {console.error('Modal element not found: targetId');return;}
            // 递归清理子元素的内联样式和hidden类
            const clearChildrenStyles = function(element) {
                if (!element) return;
                const children = element.children;
                for (let i = 0; i < children.length; i++) {
                    const child = children[i];
                    // 清理hidden类
                    child.classList.remove("hidden");
                    // 清理内联样式
                    child.style.display = "";
                    child.style.visibility = "";
                    child.style.opacity = "";
                    child.style.transform = "";
                    child.style.animation = "";
                    // 递归处理子元素的子元素
                    clearChildrenStyles(child);
                }
            };
            // 1. 清理该元素之前的状态和监听器
            if (modal._hideAnimationEndHandler) {
                modal.removeEventListener("animationend", modal._hideAnimationEndHandler);
                delete modal._hideAnimationEndHandler;
            }
            if (modal._hideTimeout){
                clearTimeout(modal._hideTimeout);
                delete modal._hideTimeout;
            }
             // 2. 移除目标元素的隐藏类并重置内联样式
            modal.classList.remove("hidden");
            modal.style.display = ""; // 清空内联隐藏，让 CSS 的 flex 自动接管
            modal.style.visibility = "";
            modal.style.opacity = "";
            modal.style.transform = "";
            modal.style.animation = "";
            // 3. 递归清理所有子元素的内联样式和hidden类
            clearChildrenStyles(modal);
            // 4. 强制重绘以确保样式应用
            void modal.offsetHeight;
            // 5. 执行显示动画
            modal.style.animation = 'yt_modalFadeIn 0.3s ease-out';
            // 6. 动画结束后清理动画样式
            const onAnimationEnd = function() {
                modal.style.animation = "";
                delete modal._showAnimationEndHandler;
            };
            modal._showAnimationEndHandler = onAnimationEnd;
            modal.addEventListener("animationend", onAnimationEnd, { once: true });
            if (callback) callback();
        },
        //移除类名
        removeClassNames: function(targetId, classNames) {
            const target = document.getElementById(targetId);
            if (!target) { console.error('Modal element not found: ' + targetId); return; }
            if (!classNames) { console.warn('No class names provided'); return; }
            const classNamesArray = classNames.split(',') || [];
            classNamesArray.forEach(className => {
                className = className.trim();
                if (className) { target.classList.remove(className); }
            });
        },
        //添加类名
        addClassNames: function(targetId, classNames) {
            const target = document.getElementById(targetId);
            if (!target) { console.error('Modal element not found: ' + targetId); return; }
            if (!classNames) { console.warn('No class names provided'); return; }
            const classNamesArray = classNames.split(',') || [];
            classNamesArray.forEach(className => {
                className = className.trim();
                if (className) { target.classList.add(className); }
            });
        }
